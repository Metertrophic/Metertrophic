<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYTA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f0e8;
            overflow-x: hidden;
            min-height: 100vh;
        }

        marquee {
            width: 100%;
            white-space: nowrap;
            padding: 20px 0;
        }

        .text {
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
            'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
            'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .what {
            font-size: 210px;
        }

        .are-you {
            font-size: 170px;
            color: #c56f4f;
        }

        .thinking {
            font-size: 100px;
        }

        /* Tablets */
        @media (max-width: 1024px) {
            .what {
                font-size: 150px;
            }

            .are-you {
                font-size: 120px;
            }

            .thinking {
                font-size: 75px;
            }
        }

        /* Mobile devices */
        @media (max-width: 600px) {
            marquee {
                padding: 35px 0;
            }

            .what {
                font-size: 85px;
            }

            .are-you {
                font-size: 65px;
            }

            .thinking {
                font-size: 42px;
            }
        }

        /* Small phones */
        @media (max-width: 380px) {
            .what {
                font-size: 65px;
            }

            .are-you {
                font-size: 50px;
            }

            .thinking {
                font-size: 32px;
            }
        }

    </style>
</head>

<body>

    <marquee behavior="scroll" direction="left" scrollamount="55">

        <span class="text what">WHAT</span>

        <span class="text are-you">ARE YOU</span>

        <span class="text thinking">THINKING ABOUT</span>

    </marquee>

</body>
</html>
